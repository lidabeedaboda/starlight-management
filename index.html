<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Starlight Management</title>
  <style>
    body {
      margin: 0;
      background: #0b0f1a;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      text-align: center;
    }

    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 220px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #4c6fff;
      color: white;
      cursor: pointer;
    }

    .dashboard {
      display: none;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .card {
      background: #151c2f;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<div class="box" id="loginBox">
  <h1>Welcome to Starlight Management</h1>

  <input id="user" placeholder="Username" />
  <input id="pass" type="password" placeholder="Password" />

  <button onclick="login()">Login</button>

  <p id="error" style="color:red;"></p>
</div>

<div class="dashboard" id="dashboard">
  <h1>📊 Starlight Dashboard</h1>

  <div class="grid">
    <div class="card">🛫 Flights: OK</div>
    <div class="card">👥 Users: 3</div>
    <div class="card">📡 Server: Stable</div>
    <div class="card">🔒 Security: Active</div>
  </div>

  <br />
  <button onclick="logout()" style="background:red;">Logout</button>
</div>

<script>
  const users = {
    stempchase: "Hmaw4357",
    vowlesjade: "hunger-game",
    wrightbec: "swim-time"
  };

  function login() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if (users[u] && users[u] === p) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    } else {
      document.getElementById("error").innerText =
        "Failed to load, contact the owner.";
    }
  }

  function logout() {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("dashboard").style.display = "none";
  }
</script>

</body>
</html>
