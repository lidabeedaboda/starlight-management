<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png"
href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Star_icon_stylized.png?v=4">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Starlight Management</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka One', cursive;
  cursor: none;
  overflow-x: hidden;
}

/* 🌌 STARS */
#stars {
  position: fixed;
  inset: 0;
  z-index: -1;
}

/* THEMES */
body.dark {
  background: radial-gradient(circle at top, #0b0f1a, #05070d);
  color: white;
}

/* 🧊 GLASS */
.card, #topbar, .loginBox, #curfew {
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 10px 35px rgba(0,0,0,0.35);
  background: rgba(21, 28, 47, 0.55);
}

/* LAYOUT */
.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

/* TOP BAR */
#topbar {
  grid-column: span 2;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* CARDS */
.card {
  padding: 12px;
}

/* TEXT */
h1 { font-size: 18px; margin: 0; }
h2 { font-size: 14px; margin-bottom: 6px; }
h3 { font-size: 13px; margin: 0; }

/* BUTTONS */
button {
  padding: 8px;
  border-radius: 10px;
  border: none;
  font-size: 12px;
  margin-top: 6px;
  background: linear-gradient(135deg,#4c6fff,#6a8dff);
  color: white;
  cursor: pointer;
}

/* INPUT */
input {
  padding: 8px;
  border-radius: 10px;
  border: none;
  margin-top: 6px;
  font-size: 12px;
}

/* CURSOR */
.cursor {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid white;
  position: fixed;
  pointer-events: none;
  transform: translate(-50%,-50%);
  z-index: 9999;
}

/* 🔒 CURFEW */
#curfew {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 99999;
}

#curfew h1 {
  font-size: 50px;
}

/* 🔐 LOGIN CENTERED */
#login {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.loginBox {
  padding: 25px;
  width: 260px;
}

</style>
</head>

<body class="dark">

<canvas id="stars"></canvas>
<div class="cursor" id="cursor"></div>

<!-- 🔒 CURFEW -->
<div id="curfew">
  <div>
    <h1>🔒</h1>
    <p>Curfew! - You can't use this app right now.</p>
  </div>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="loginBox">
    <h2>⭐ Login</h2>
    <input id="user" placeholder="Username"><br>
    <input id="pass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="container">

<div id="topbar">
  <h1 id="greeting">Dashboard</h1>
  <button onclick="toggleTheme()">Theme</button>
</div>

<!-- EVENTS -->
<div class="card">
<h2>🗓️ Today</h2>
<div id="events"></div>
</div>

<!-- LINKS -->
<div class="card">
<h2>🔗 Links</h2>
<a href="https://portal.inaburra.school/auth/portal" target="_blank">School Portal</a>
<a href="https://spotify.com" target="_blank">Spotify</a>
<a href="https://mail.google.com" target="_blank">Mail</a>
</div>

<!-- TIMER (UPDATED) -->
<div class="card">
<h2>⏳ Timer</h2>
<input id="dateInput" type="datetime-local"><br>

<button onclick="startTimer()">Start</button>
<button onclick="stopTimer()">Stop</button>

<h3 id="countdown">No timer</h3>
</div>

<!-- TIME -->
<div class="card">
<h2>🕒 Time</h2>
<h3 id="time"></h3>
</div>

<!-- DRIVE -->
<div class="card">
<h2>📁 Drive</h2>
<button onclick="window.open('https://drive.google.com','_blank')">
Open Drive
</button>
</div>

</div>
</div>

<script>

const users = {
  stempchase:"Hmaw4357",
  vowlesjade:"hunger-game",
  wrightbec:"swim-time"
};

let currentTimer = null;

/* CURFEW: 9:53PM - 8:24AM */
function isCurfew(){
  const h = new Date().getHours();
  const m = new Date().getMinutes();

  const minutes = h*60 + m;

  const start = 21*60 + 53; // 9:53 PM
  const end = 8*60 + 24;    // 8:24 AM

  return (minutes >= start || minutes < end);
}

/* LOGIN */
function login(){
  const u=document.getElementById("user").value.trim();
  const p=document.getElementById("pass").value.trim();

  if(users[u] && users[u]===p){

    if(isCurfew()){
      document.getElementById("login").style.display="none";
      document.getElementById("curfew").style.display="flex";
      return;
    }

    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";

    setGreeting();
    loadEvents();
    startClock();

  } else {
    document.getElementById("error").innerText="Invalid login";
  }
}

/* GREETING */
function setGreeting(){
  const h=new Date().getHours();
  let g="Good Evening";

  if(h<12) g="Good Morning";
  else if(h<18) g="Good Afternoon";

  document.getElementById("greeting").innerText =
  `${g}, ${document.getElementById("user").value}`;
}

/* CLOCK */
function startClock(){
  setInterval(()=>{
    document.getElementById("time").innerText =
    new Date().toLocaleTimeString();
  },1000);
}

/* EVENTS */
const schedule = {
  Monday:["Sport Uniform"],
  Tuesday:["Sport Uniform"],
  Wednesday:["Assembly"],
  Friday:["Twilight (12th June)"]
};

function loadEvents(){
  const day=new Date().toLocaleDateString("en-US",{weekday:"long"});
  const box=document.getElementById("events");

  box.innerHTML = schedule[day]
    ? schedule[day].map(e=>`<div>${e}</div>`).join("")
    : "No events today 🎉";
}

/* ⏳ TIMER START */
function startTimer(){
  const t = new Date(document.getElementById("dateInput").value).getTime();

  stopTimer();

  currentTimer = setInterval(()=>{
    const d = t - Date.now();
    if(d <= 0){
      document.getElementById("countdown").innerText = "Done!";
      return;
    }

    document.getElementById("countdown").innerText =
    `${Math.floor(d/86400000)}d ${Math.floor((d%86400000)/3600000)}h ${Math.floor((d%3600000)/60000)}m ${Math.floor((d%60000)/1000)}s`;

  },1000);
}

/* STOP TIMER */
function stopTimer(){
  if(currentTimer){
    clearInterval(currentTimer);
    currentTimer = null;
  }
  document.getElementById("countdown").innerText = "Stopped";
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* CURSOR */
document.addEventListener("mousemove",(e)=>{
  const c=document.getElementById("cursor");
  c.style.left=e.clientX+"px";
  c.style.top=e.clientY+"px";
});

/* 🌌 STARS */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

let w,h,stars=[];

function resize(){
  w=canvas.width=window.innerWidth;
  h=canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

for(let i=0;i<120;i++){
  stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5,s:Math.random()*0.4+0.1});
}

function draw(){
  ctx.clearRect(0,0,w,h);
  for(let s of stars){
    ctx.fillStyle="white";
    ctx.globalAlpha=0.8;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();

    s.y+=s.s;
    if(s.y>h){ s.y=0; s.x=Math.random()*w; }
  }
  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
