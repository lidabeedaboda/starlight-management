<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- ⭐ FAVICON FIXED -->
<link rel="icon" type="image/png" sizes="32x32"
href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Star_icon_stylized.png">

<title>Starlight Management</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka One', cursive;
  cursor: none;
  transition: 0.3s;
  overflow-x: hidden;
}

/* 🌙 THEMES */
body.dark {
  background: radial-gradient(circle at top, #0b0f1a, #05070d);
  color: white;
}
body.light {
  background: radial-gradient(circle at top, #f4f6ff, #e9ecff);
  color: #111;
}

/* ✨ GLASS EFFECT */
.card, .loginBox, #settings {
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

body.dark .card,
body.dark .loginBox,
body.dark #settings {
  background: rgba(21, 28, 47, 0.6);
}

body.light .card,
body.light .loginBox,
body.light #settings {
  background: rgba(255, 255, 255, 0.6);
}

/* CONTAINER */
.container {
  padding: 30px;
  padding-bottom: 100px;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

/* CARDS */
.card {
  padding: 15px;
  border-radius: 16px;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-3px);
}

/* INPUTS */
input, button {
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  font-family: 'Fredoka One', cursive;
}

button {
  background: linear-gradient(135deg, #4c6fff, #6a8dff);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.03);
}

/* BIG CARDS */
.big { grid-column: span 2; }

/* LOGIN */
#login {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* SETTINGS */
#settings {
  position: fixed;
  right: 20px;
  top: 80px;
  display: none;
  padding: 15px;
  border-radius: 12px;
  z-index: 999;
}

/* CURSOR */
.cursor {
  width: 14px;
  height: 14px;
  border: 2px solid white;
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 9999;
}
body.light .cursor { border-color: #111; }

/* VERSION */
.version {
  position: fixed;
  bottom: 0;
  width: 100%;
  font-size: 12px;
  padding: 8px;
  display: flex;
  justify-content: space-between;
  backdrop-filter: blur(10px);
}

/* NOTIF */
#notif {
  position: fixed;
  bottom: 60px;
  right: 20px;
  background: rgba(21,28,47,0.9);
  padding: 12px;
  border-radius: 10px;
  display: none;
  max-width: 220px;
}

/* 🔗 QUICK LINKS */
.linkBtn {
  display: block;
  text-decoration: none;
  margin-top: 8px;
  padding: 10px;
  border-radius: 10px;
  background: rgba(76,110,255,0.2);
  color: inherit;
  transition: 0.2s;
}

.linkBtn:hover {
  background: rgba(76,110,255,0.4);
  transform: translateX(3px);
}

</style>
</head>

<body class="dark">

<script>
const Lockdown = false;

const users = {
  stempchase:"Hmaw4357",
  vowlesjade:"hunger-game",
  wrightbec:"swim-time"
};

let version = 1.0;

const quotes = [
  "💗 You are loved",
  "⭐️ Live life to the fullest",
  "🌈 Keep going, you're doing great",
  "🔥 Stay strong",
  "💫 You matter",
  "🚀 Keep pushing forward",
  "🌻 Today is a new chance",
  "💎 Shine in your own way"
];
</script>

<!-- CURSOR -->
<div class="cursor" id="cursor"></div>

<!-- LOGIN -->
<div id="login">
  <div class="loginBox">
    <h2>Starlight Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="container">

<h1>📊 Starlight Dashboard</h1>

<button onclick="toggleSettings()">⚙️ Settings</button>

<div class="grid">

<div class="card big">
<h2>📌 Notice Board</h2>
<p>hii all! there are no exams for the rest of the term woo!</p>
</div>

<!-- 🔗 QUICK LINKS -->
<div class="card big">
<h2>🔗 Quick Links</h2>

<a class="linkBtn" href="https://portal.inaburra.school/auth/portal" target="_blank">
School Portal
</a>

<a class="linkBtn" href="https://spotify.com" target="_blank">
Spotify
</a>

<a class="linkBtn" href="https://mail.google.com" target="_blank">
Mail
</a>

</div>

<div class="card big">
<h2>⏳ Countdown</h2>
<input id="dateInput" type="datetime-local">
<button onclick="startCountdown()">Start</button>
<h3 id="countdown">No timer</h3>
</div>

<div class="card">
<h2>🕒 Time</h2>
<h3 id="time"></h3>
</div>

<div class="card">
<h2>📡 System</h2>
<p>Server: Stable</p>
<p>Security: Active</p>
</div>

</div>
</div>

</div>

<!-- SETTINGS -->
<div id="settings">
<button onclick="toggleTheme()">Light / Dark</button>
</div>

<!-- NOTIF -->
<div id="notif"></div>

<!-- VERSION -->
<div class="version">
<div>Starlight System</div>
<div id="ver"></div>
</div>

<script>

/* LOGIN */
function login(){
  const u=document.getElementById("user").value.trim();
  const p=document.getElementById("pass").value.trim();

  if(users[u] && users[u]===p){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    startNotifications();
  } else {
    document.getElementById("error").innerText="Failed to load, contact the owner.";
  }
}

/* CLOCK */
setInterval(()=>{
  document.getElementById("time").innerText=new Date().toLocaleTimeString();
},1000);

/* COUNTDOWN */
function startCountdown(){
  const t=new Date(document.getElementById("dateInput").value).getTime();

  setInterval(()=>{
    const now=Date.now();
    const d=t-now;
    if(d<=0)return;

    const dd=Math.floor(d/86400000);
    const hh=Math.floor((d%86400000)/3600000);
    const mm=Math.floor((d%3600000)/60000);
    const ss=Math.floor((d%60000)/1000);

    document.getElementById("countdown").innerText=
    `${dd}d ${hh}h ${mm}m ${ss}s`;
  },1000);
}

/* SETTINGS */
function toggleSettings(){
  const s=document.getElementById("settings");
  s.style.display=s.style.display==="block"?"none":"block";
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* CURSOR */
document.addEventListener("mousemove",(e)=>{
  const c=document.getElementById("cursor");
  c.style.left=e.clientX+"px";
  c.style.top=e.clientY+"px";
});

/* NOTIF */
function notify(msg){
  const n=document.getElementById("notif");
  n.innerText=msg;
  n.style.display="block";
  setTimeout(()=>n.style.display="none",4000);
}

function startNotifications(){
  setInterval(()=>{
    if(Math.random()>0.5){
      notify(quotes[Math.floor(Math.random()*quotes.length)]);
    }
  },12000);
}

/* VERSION */
document.getElementById("ver").innerText=
`v${version.toFixed(1)}.0 • build ${Math.floor(Math.random()*900+100)}`;

</script>

</body>
</html>
