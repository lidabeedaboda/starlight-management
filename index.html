<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starlight Dashboard</title>

<style>
  body {
    margin: 0;
    font-family: Arial;
    background: #0b0f1a;
    color: white;
  }

  .container {
    padding: 30px;
    padding-bottom: 80px;
  }

  h1 {
    margin-bottom: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }

  .card {
    background: #151c2f;
    padding: 15px;
    border-radius: 10px;
  }

  input, button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
  }

  button {
    background: #4c6fff;
    color: white;
    cursor: pointer;
  }

  .big {
    grid-column: span 2;
  }

  /* VERSION FOOTER */
  .version {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0a0d16;
    padding: 10px;
    font-size: 12px;
    color: #aaa;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>

<body>

<div class="container">

  <h1>📊 Starlight Management Dashboard</h1>

  <div class="grid">

    <!-- COUNTDOWN -->
    <div class="card big">
      <h2>⏳ Countdown Timer</h2>

      <input id="dateInput" type="datetime-local">
      <button onclick="startCountdown()">Start Countdown</button>

      <h3 id="countdown">No timer set</h3>
    </div>

    <!-- CLOCK -->
    <div class="card">
      <h2>🕒 Current Time</h2>
      <h3 id="time"></h3>
    </div>

    <!-- STATUS -->
    <div class="card">
      <h2>📡 System Status</h2>
      <p>Server: Stable</p>
      <p>Users: Online</p>
      <p>Security: Active</p>
    </div>

    <!-- SPOTIFY -->
    <div class="card big">
      <h2>🎵 Spotify Player</h2>

      <iframe style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
        width="100%" height="152"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>

    </div>

  </div>

</div>

<!-- VERSION BAR -->
<div class="version">
  <div>Starlight Management System</div>
  <div>v1.0.0 • build 001 • stable</div>
</div>

<script>
  // LIVE CLOCK
  setInterval(() => {
    document.getElementById("time").innerText =
      new Date().toLocaleTimeString();
  }, 1000);

  // COUNTDOWN
  function startCountdown() {
    const input = document.getElementById("dateInput").value;
    const countdownEl = document.getElementById("countdown");

    const target = new Date(input).getTime();

    setInterval(() => {
      const now = new Date().getTime();
      const diff = target - now;

      if (diff <= 0) {
        countdownEl.innerText = "Time reached!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      countdownEl.innerText =
        `${days}d ${hours}h ${mins}m ${secs}s`;
    }, 1000);
  }
</script>

</body>
</html>
