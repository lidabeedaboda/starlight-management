<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Star_icon_stylized.png">
  <meta charset="UTF-8">
  <title>Starlight Management</title>
</head>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka One', cursive;
  cursor: none;
  transition: 0.3s;
}

/* THEMES */
body.dark { background:#0b0f1a; color:white; }
body.light { background:#f4f6ff; color:#111; }

.container { padding:30px; padding-bottom:80px; }

.grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card {
  padding:15px;
  border-radius:12px;
}

body.dark .card { background:#151c2f; }
body.light .card { background:white; }

input,button {
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:10px;
  font-family:'Fredoka One',cursive;
}

button { background:#4c6fff; color:white; cursor:pointer; }

.big { grid-column:span 2; }

/* LOGIN */
#login {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.loginBox {
  text-align:center;
  padding:30px;
  border-radius:12px;
}

body.dark .loginBox { background:#151c2f; }
body.light .loginBox { background:white; }

/* SETTINGS */
#settings {
  position:fixed;
  right:20px;
  top:80px;
  display:none;
  padding:15px;
  border-radius:12px;
  z-index:999;
}

body.dark #settings { background:#151c2f; }
body.light #settings { background:white; }

/* CURSOR */
.cursor {
  width:14px;
  height:14px;
  border:2px solid white;
  border-radius:50%;
  position:fixed;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9999;
}

body.light .cursor { border-color:#111; }

/* VERSION */
.version {
  position:fixed;
  bottom:0;
  width:100%;
  font-size:12px;
  padding:8px;
  display:flex;
  justify-content:space-between;
}

body.dark .version { background:#0a0d16; color:#aaa; }
body.light .version { background:#e9ecff; color:#333; }

/* NOTIFICATION */
#notif {
  position:fixed;
  bottom:60px;
  right:20px;
  background:#151c2f;
  padding:12px;
  border-radius:10px;
  display:none;
  max-width:220px;
}
</style>
</head>

<body class="dark">

<script>
const Lockdown = false;

const users = {
  stempchase:"Hmaw4357",
  vowlesjade:"hunger-game",
  wrightbec:"swim-time"
};

let version = 1.0;

/* QUOTES */
const quotes = [
  "💗 You are loved",
  "⭐️ Live life to the fullest",
  "🌈 Keep going, you're doing great",
  "🔥 Stay strong",
  "💫 You matter",
  "🚀 Keep pushing forward",
  "🌻 Today is a new chance",
  "💎 Shine in your own way"
];
</script>

<!-- LOCKDOWN -->
<div id="lockdown" style="display:none;position:fixed;inset:0;background:#0b0f1a;justify-content:center;align-items:center;text-align:center;z-index:99999;">
  <div>
    <h1>🔒</h1>
    <h2>Whoops!</h2>
    <p>Your administrator has locked this website temporarily.</p>
  </div>
</div>

<div class="cursor" id="cursor"></div>

<!-- LOGIN -->
<div id="login">
  <div class="loginBox">
    <h2>Starlight Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app" style="display:none">

<div class="container">

<h1>📊 Starlight Dashboard</h1>

<button onclick="toggleSettings()">⚙️ Settings</button>

<div class="grid">

<!-- NOTICE -->
<div class="card big">
<h2>📌 Notice Board</h2>
<p>hii all! there are no exams for the rest of the term woo!</p>
</div>

<!-- COUNTDOWN -->
<div class="card big">
<h2>⏳ Countdown</h2>
<input id="dateInput" type="datetime-local">
<button onclick="startCountdown()">Start</button>
<h3 id="countdown">No timer</h3>
</div>

<!-- TIME -->
<div class="card">
<h2>🕒 Time</h2>
<h3 id="time"></h3>
</div>

<!-- SYSTEM -->
<div class="card">
<h2>📡 System</h2>
<p>Server: Stable</p>
<p>Security: Active</p>
</div>

<!-- SPOTIFY -->
<div class="card big">
<h2>🎵 Spotify</h2>
<iframe style="border-radius:12px"
src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
width="100%" height="152"></iframe>
</div>

<!-- DRIVE -->
<div class="card big">
<h2>📁 Drive</h2>
<button onclick="window.open('https://drive.google.com/drive/folders/1lPVoGQoMKUANKemo4t9W1xjTV8U0jbfL','_blank')">
Open Drive
</button>
</div>

</div>
</div>

</div>

<!-- SETTINGS -->
<div id="settings">
<button onclick="toggleTheme()">Light / Dark</button>
</div>

<!-- NOTIFICATION -->
<div id="notif"></div>

<!-- VERSION -->
<div class="version">
<div>Starlight System</div>
<div id="ver"></div>
</div>

<script>

/* LOCKDOWN */
if (Lockdown) {
  document.getElementById("lockdown").style.display="flex";
}

/* LOGIN */
function login(){
  const u=document.getElementById("user").value.trim();
  const p=document.getElementById("pass").value.trim();

  if(users[u] && users[u]===p){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    startNotifications();
  } else {
    document.getElementById("error").innerText="Failed to load, contact the owner.";
  }
}

/* CLOCK */
setInterval(()=>{
  document.getElementById("time").innerText=new Date().toLocaleTimeString();
},1000);

/* COUNTDOWN */
function startCountdown(){
  const t=new Date(document.getElementById("dateInput").value).getTime();

  setInterval(()=>{
    const now=Date.now();
    const d=t-now;
    if(d<=0)return;

    const dd=Math.floor(d/86400000);
    const hh=Math.floor((d%86400000)/3600000);
    const mm=Math.floor((d%3600000)/60000);
    const ss=Math.floor((d%60000)/1000);

    document.getElementById("countdown").innerText=
    `${dd}d ${hh}h ${mm}m ${ss}s`;
  },1000);
}

/* SETTINGS */
function toggleSettings(){
  const s=document.getElementById("settings");
  s.style.display=s.style.display==="block"?"none":"block";
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* CURSOR */
document.addEventListener("mousemove",(e)=>{
  const c=document.getElementById("cursor");
  c.style.left=e.clientX+"px";
  c.style.top=e.clientY+"px";
});

/* NOTIFICATIONS */
function notify(msg){
  const n=document.getElementById("notif");
  n.innerText=msg;
  n.style.display="block";
  setTimeout(()=>n.style.display="none",4000);
}

function startNotifications(){
  setInterval(()=>{
    if(Math.random()>0.5){
      const msg=quotes[Math.floor(Math.random()*quotes.length)];
      notify(msg);
    }
  },12000);
}

/* VERSION */
document.getElementById("ver").innerText=
`v${version.toFixed(1)}.0 • build ${Math.floor(Math.random()*900+100)}`;

</script>

</body>
</html>
