<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- ⭐ FAVICON -->
<link rel="icon" type="image/png"
href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Star_icon_stylized.png">

<title>Starlight Management</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka One', cursive;
  cursor: none;
  overflow-x: hidden;
}

/* 🌌 STAR CANVAS */
#stars {
  position: fixed;
  inset: 0;
  z-index: -2;
}

/* 🌙 BACKGROUNDS */
body.dark {
  background: radial-gradient(circle at top, #0b0f1a, #05070d);
  color: white;
}

body.light {
  background: radial-gradient(circle at top, #f4f6ff, #e9ecff);
  color: #111;
}

/* 🧊 GLASS UI */
.card, .loginBox, #settings {
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  border-radius: 18px;
  transition: 0.25s;
}

body.dark .card,
body.dark .loginBox,
body.dark #settings {
  background: rgba(21, 28, 47, 0.55);
}

body.light .card,
body.light .loginBox,
body.light #settings {
  background: rgba(255, 255, 255, 0.6);
}

/* LAYOUT */
.container {
  padding: 30px;
  padding-bottom: 90px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

/* CARD */
.card {
  padding: 15px;
}

.card:hover {
  transform: translateY(-4px);
}

/* BUTTONS */
button {
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  font-family: inherit;
  background: linear-gradient(135deg, #4c6fff, #6a8dff);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.04);
}

/* INPUT */
input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
  font-family: inherit;
}

/* LOGIN */
#login {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* SETTINGS */
#settings {
  position: fixed;
  right: 20px;
  top: 80px;
  display: none;
  padding: 15px;
  z-index: 999;
}

/* CURSOR */
.cursor {
  width: 14px;
  height: 14px;
  border: 2px solid white;
  border-radius: 50%;
  position: fixed;
  pointer-events: none;
  transform: translate(-50%, -50%);
  z-index: 9999;
}
body.light .cursor { border-color:#111; }

/* VERSION */
.version {
  position: fixed;
  bottom: 0;
  width: 100%;
  font-size: 12px;
  padding: 8px;
  display: flex;
  justify-content: space-between;
  backdrop-filter: blur(10px);
}

/* NOTIF */
#notif {
  position: fixed;
  bottom: 60px;
  right: 20px;
  padding: 12px;
  border-radius: 10px;
  display: none;
  max-width: 220px;
  backdrop-filter: blur(12px);
  background: rgba(20,20,30,0.7);
}

/* 🔗 QUICK LINKS SMALL */
.quickLinks a {
  display: block;
  font-size: 12px;
  padding: 6px 8px;
  margin-top: 6px;
  border-radius: 8px;
  text-decoration: none;
  background: rgba(76,110,255,0.15);
  color: inherit;
  transition: 0.2s;
}

.quickLinks a:hover {
  background: rgba(76,110,255,0.3);
  transform: translateX(2px);
}

/* 🧊 SPLIT LAYOUT */
.split {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 15px;
}

/* BIG */
.big { grid-column: span 2; }

</style>
</head>

<body class="dark">

<!-- 🌌 STARS -->
<canvas id="stars"></canvas>

<script>
const users = {
  stempchase:"Hmaw4357",
  vowlesjade:"hunger-game",
  wrightbec:"swim-time"
};

let version = 1.0;

const quotes = [
  "💗 You are loved",
  "⭐️ Live life to the fullest",
  "🌈 Keep going, you're doing great",
  "🔥 Stay strong",
  "💫 You matter",
  "🚀 Keep pushing forward",
  "🌻 Today is a new chance"
];
</script>

<div class="cursor" id="cursor"></div>

<!-- LOGIN -->
<div id="login">
  <div class="loginBox" style="padding:30px;text-align:center;">
    <h2>Starlight Login</h2>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="container">

<h1>📊 Starlight Dashboard</h1>

<button onclick="toggleSettings()">⚙️ Settings</button>

<!-- SPLIT: COUNTDOWN + QUICK LINKS -->
<div class="split">

<div class="card">
<h2>⏳ Countdown</h2>
<input id="dateInput" type="datetime-local">
<button onclick="startCountdown()">Start</button>
<h3 id="countdown">No timer</h3>
</div>

<div class="card quickLinks">
<h3>🔗 Quick Links</h3>
<a href="https://portal.inaburra.school/auth/portal" target="_blank">School Portal</a>
<a href="https://spotify.com" target="_blank">Spotify</a>
<a href="https://mail.google.com" target="_blank">Mail</a>
</div>

</div>

<div class="grid">

<div class="card">
<h2>🕒 Time</h2>
<h3 id="time"></h3>
</div>

<div class="card">
<h2>📡 System</h2>
<p>Server: Stable</p>
<p>Security: Active</p>
</div>

<div class="card big">
<h2>📌 Notice Board</h2>
<p>hii all! there are no exams for the rest of the term woo!</p>
</div>

</div>
</div>
</div>

<!-- SETTINGS -->
<div id="settings">
<button onclick="toggleTheme()">Light / Dark</button>
</div>

<!-- NOTIF -->
<div id="notif"></div>

<!-- VERSION -->
<div class="version">
<div>Starlight System</div>
<div id="ver"></div>
</div>

<script>

/* LOGIN */
function login(){
  const u=document.getElementById("user").value.trim();
  const p=document.getElementById("pass").value.trim();

  if(users[u] && users[u]===p){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    startNotifications();
  } else {
    document.getElementById("error").innerText="Invalid login";
  }
}

/* CLOCK */
setInterval(()=>{
  document.getElementById("time").innerText =
  new Date().toLocaleTimeString();
},1000);

/* COUNTDOWN */
function startCountdown(){
  const t=new Date(document.getElementById("dateInput").value).getTime();

  setInterval(()=>{
    const d=t-Date.now();
    if(d<=0)return;

    const dd=Math.floor(d/86400000);
    const hh=Math.floor((d%86400000)/3600000);
    const mm=Math.floor((d%3600000)/60000);
    const ss=Math.floor((d%60000)/1000);

    document.getElementById("countdown").innerText=
    `${dd}d ${hh}h ${mm}m ${ss}s`;
  },1000);
}

/* SETTINGS */
function toggleSettings(){
  const s=document.getElementById("settings");
  s.style.display=s.style.display==="block"?"none":"block";
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* CURSOR */
document.addEventListener("mousemove",(e)=>{
  const c=document.getElementById("cursor");
  c.style.left=e.clientX+"px";
  c.style.top=e.clientY+"px";
});

/* NOTIF */
function notify(msg){
  const n=document.getElementById("notif");
  n.innerText=msg;
  n.style.display="block";
  setTimeout(()=>n.style.display="none",4000);
}

function startNotifications(){
  setInterval(()=>{
    if(Math.random()>0.6){
      notify(quotes[Math.floor(Math.random()*quotes.length)]);
    }
  },12000);
}

/* VERSION */
document.getElementById("ver").innerText=
`v${version.toFixed(1)} • build ${Math.floor(Math.random()*900+100)}`;

/* 🌌 STAR BACKGROUND */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars=[];
let w,h;

function resize(){
  w=canvas.width=window.innerWidth;
  h=canvas.height=window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

function init(){
  for(let i=0;i<120;i++){
    stars.push({
      x:Math.random()*w,
      y:Math.random()*h,
      r:Math.random()*1.5,
      s:Math.random()*0.4+0.1,
      a:Math.random()
    });
  }
}

function draw(){
  ctx.clearRect(0,0,w,h);

  for(let s of stars){
    ctx.fillStyle=`rgba(255,255,255,${s.a})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();

    s.y+=s.s;
    if(s.y>h){
      s.y=0;
      s.x=Math.random()*w;
    }
  }

  requestAnimationFrame(draw);
}

init();
draw();

</script>

</body>
</html>
