<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starlight System</title>

<!-- Fredoka One font -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    font-family: 'Fredoka One', cursive;
    transition: 0.3s;
    cursor: none;
  }

  /* THEMES */
  body.dark {
    background: #0b0f1a;
    color: white;
  }

  body.light {
    background: #f4f6ff;
    color: #111;
  }

  .container {
    padding: 30px;
    padding-bottom: 80px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }

  .card {
    padding: 15px;
    border-radius: 12px;
  }

  body.dark .card { background: #151c2f; }
  body.light .card { background: white; }

  input, button {
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    font-family: 'Fredoka One', cursive;
  }

  button {
    background: #4c6fff;
    color: white;
    cursor: pointer;
  }

  .big { grid-column: span 2; }

  /* LOGIN */
  #login {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .loginBox {
    text-align: center;
    padding: 30px;
    border-radius: 12px;
  }

  body.dark .loginBox { background: #151c2f; }
  body.light .loginBox { background: white; }

  /* SETTINGS */
  #settingsPanel {
    position: fixed;
    right: 20px;
    top: 80px;
    width: 220px;
    padding: 15px;
    border-radius: 12px;
    display: none;
  }

  body.dark #settingsPanel { background: #151c2f; }
  body.light #settingsPanel { background: white; }

  /* CURSOR */
  .cursor {
    width: 14px;
    height: 14px;
    border: 2px solid white;
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
  }

  body.light .cursor { border-color: #111; }

  /* VERSION */
  .version {
    position: fixed;
    bottom: 0;
    width: 100%;
    font-size: 12px;
    padding: 8px;
    display: flex;
    justify-content: space-between;
  }

  body.dark .version { background: #0a0d16; color: #aaa; }
  body.light .version { background: #e9ecff; color: #333; }

  /* LOCKDOWN SCREEN */
  #lockdown {
    position: fixed;
    inset: 0;
    background: #0b0f1a;
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 99999;
  }

  #lockdown h1 {
    font-size: 60px;
  }
</style>
</head>

<body class="dark">

<!-- CHANGE THIS -->
<script>
const Lockdown = true; // 🔒 SET TRUE TO LOCK SITE
let version = 1.0;
</script>

<!-- LOCKDOWN SCREEN -->
<div id="lockdown">
  <div>
    <h1>🔒</h1>
    <h2>Whoops!</h2>
    <p>Your administrator has locked this website temporarily.</p>
  </div>
</div>

<div class="cursor" id="cursor"></div>

<!-- LOGIN -->
<div id="login">
  <div class="loginBox">
    <h2>Starlight Login</h2>

    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app" style="display:none">

<div class="container">

  <h1>📊 Starlight Dashboard</h1>

  <button onclick="toggleSettings()">⚙️ Settings</button>

  <div class="grid">

    <div class="card big">
      <h2>⏳ Countdown</h2>
      <input id="dateInput" type="datetime-local">
      <button onclick="startCountdown()">Start</button>
      <h3 id="countdown">No timer</h3>
    </div>

    <div class="card">
      <h2>🕒 Time</h2>
      <h3 id="time"></h3>
    </div>

    <div class="card">
      <h2>📡 System</h2>
      <p>Server: Stable</p>
      <p>Security: Active</p>
    </div>

    <div class="card big">
      <h2>🎵 Spotify</h2>
      <iframe style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
        width="100%" height="152"></iframe>
    </div>

    <div class="card big">
      <h2>📁 Drive</h2>
      <iframe
        src="https://drive.google.com/embeddedfolderview?id=1lPVoGQoMKUANKemo4t9W1xjTV8U0jbfL#grid"
        style="width:100%; height:300px; border:0;">
      </iframe>
    </div>

  </div>
</div>

</div>

<!-- SETTINGS -->
<div id="settingsPanel">
  <h3>Settings</h3>

  <button onclick="toggleTheme()">Toggle Light/Dark</button>
</div>

<!-- VERSION -->
<div class="version">
  <div>Starlight System</div>
  <div id="ver"></div>
</div>

<script>
const users = {
  stempchase: "Hmaw4357",
  vowlesjade: "hunger-game",
  wrightbec: "swim-time"
};

/* LOCKDOWN CHECK */
if (Lockdown) {
  document.getElementById("lockdown").style.display = "flex";
}

/* LOGIN */
function login() {
  const u = document.getElementById("user").value.trim();
  const p = document.getElementById("pass").value.trim();

  if (users[u] && users[u] === p) {
    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";
  } else {
    document.getElementById("error").innerText =
      "Failed to load, contact the owner.";
  }
}

/* CLOCK */
setInterval(() => {
  document.getElementById("time").innerText =
    new Date().toLocaleTimeString();
}, 1000);

/* COUNTDOWN */
function startCountdown() {
  const target = new Date(document.getElementById("dateInput").value).getTime();

  setInterval(() => {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) return;

    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000)/3600000);
    const m = Math.floor((diff % 3600000)/60000);
    const s = Math.floor((diff % 60000)/1000);

    document.getElementById("countdown").innerText =
      `${d}d ${h}h ${m}m ${s}s`;
  }, 1000);
}

/* SETTINGS */
function toggleSettings() {
  const s = document.getElementById("settingsPanel");
  s.style.display = s.style.display === "block" ? "none" : "block";
}

/* THEME */
function toggleTheme() {
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* CURSOR */
document.addEventListener("mousemove", (e) => {
  const c = document.getElementById("cursor");
  c.style.left = e.clientX + "px";
  c.style.top = e.clientY + "px";
});

/* VERSION AUTO */
document.getElementById("ver").innerText =
  `v${version.toFixed(1)}.0 • build ${Math.floor(Math.random()*900+100)}`;
</script>

</body>
</html>
