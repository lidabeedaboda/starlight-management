<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png"
href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Star_icon_stylized.png">

<title>Starlight Management</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka One', cursive;
  cursor: none;
  overflow-x: hidden;
}

/* 🌌 STAR BACKGROUND ONLY */
#stars {
  position: fixed;
  inset: 0;
  z-index: -1;
}

/* THEMES */
body.dark {
  background: radial-gradient(circle at top, #0b0f1a, #05070d);
  color: white;
}

body.light {
  background: radial-gradient(circle at top, #f4f6ff, #e9ecff);
  color: #111;
}

/* 🧊 GLASS */
.card, #topbar, .loginBox {
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 16px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.35);
}

body.dark .card,
body.dark #topbar,
body.dark .loginBox {
  background: rgba(21, 28, 47, 0.55);
}

body.light .card,
body.light #topbar,
body.light .loginBox {
  background: rgba(255,255,255,0.6);
}

/* LAYOUT */
.container {
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* TOP BAR */
#topbar {
  grid-column: span 2;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* CARDS */
.card {
  padding: 12px;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-5px);
}

/* FULL WIDTH */
.full {
  grid-column: span 2;
}

/* TEXT */
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin-bottom: 6px; }
h3 { font-size: 13px; margin: 0; }
p { font-size: 12px; }

/* BUTTONS */
button {
  padding: 8px;
  border-radius: 10px;
  border: none;
  font-size: 12px;
  background: linear-gradient(135deg,#4c6fff,#6a8dff);
  color: white;
  cursor: pointer;
}

/* QUICK LINKS */
a {
  display: block;
  font-size: 12px;
  margin-top: 6px;
  color: inherit;
  text-decoration: none;
  padding: 6px;
  border-radius: 8px;
  background: rgba(76,110,255,0.15);
}

/* EVENTS */
.event {
  padding: 8px;
  margin-top: 6px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  font-size: 12px;
}

/* LOGIN */
#login {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* CURSOR */
.cursor {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid white;
  position: fixed;
  pointer-events: none;
  transform: translate(-50%,-50%);
  z-index: 9999;
}
body.light .cursor { border-color:#111; }

</style>
</head>

<body class="dark">

<canvas id="stars"></canvas>
<div class="cursor" id="cursor"></div>

<!-- LOGIN -->
<div id="login">
  <div class="loginBox" style="padding:25px;text-align:center;">
    <h2>⭐ Starlight Login</h2>
    <input id="user" placeholder="Username"><br><br>
    <input id="pass" type="password" placeholder="Password"><br><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<!-- TOP BAR -->
<div id="topbar">
  <h1>📊 Starlight Dashboard</h1>
  <button onclick="toggleTheme()">Toggle Theme</button>
</div>

<div class="container">

<!-- LEFT SIDE -->
<div class="card">
<h2>🗓️ Today’s Events</h2>
<div id="events"></div>
</div>

<div class="card">
<h2>🔗 Quick Links</h2>
<a href="https://portal.inaburra.school/auth/portal" target="_blank">School Portal</a>
<a href="https://spotify.com" target="_blank">Spotify</a>
<a href="https://mail.google.com" target="_blank">Mail</a>
</div>

<!-- RIGHT SIDE -->
<div class="card">
<h2>⏳ Countdown</h2>
<input id="dateInput" type="datetime-local"><br><br>
<button onclick="startCountdown()">Start</button>
<h3 id="countdown">No timer</h3>
</div>

<div class="card">
<h2>🕒 Time</h2>
<h3 id="time"></h3>
</div>

<div class="card full">
<h2>📁 Drive</h2>
<button onclick="window.open('https://drive.google.com','_blank')">
Open Drive
</button>
</div>

<div class="card full">
<h2>🎵 Spotify Player</h2>
<iframe style="border-radius:12px"
src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M"
width="100%" height="152"></iframe>
</div>

</div>
</div>

<script>

/* USERS */
const users = {
  stempchase:"Hmaw4357",
  vowlesjade:"hunger-game",
  wrightbec:"swim-time"
};

/* EVENTS */
const schedule = {
  Monday:["Sport Uniform"],
  Tuesday:["Sport Uniform"],
  Wednesday:["Assembly"],
  Friday:["Twilight (12th June)"]
};

/* LOGIN */
function login(){
  const u=document.getElementById("user").value.trim();
  const p=document.getElementById("pass").value.trim();

  if(users[u] && users[u]===p){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    loadEvents();
  } else {
    document.getElementById("error").innerText="Invalid login";
  }
}

/* EVENTS */
function loadEvents(){
  const day=new Date().toLocaleDateString("en-US",{weekday:"long"});
  const box=document.getElementById("events");
  box.innerHTML="";

  if(schedule[day]){
    schedule[day].forEach(e=>{
      const d=document.createElement("div");
      d.className="event";
      d.innerText=e;
      box.appendChild(d);
    });
  } else {
    box.innerHTML="<div class='event'>No events today 🎉</div>";
  }
}

/* CLOCK */
setInterval(()=>{
  document.getElementById("time").innerText=new Date().toLocaleTimeString();
},1000);

/* COUNTDOWN */
function startCountdown(){
  const t=new Date(document.getElementById("dateInput").value).getTime();

  setInterval(()=>{
    const d=t-Date.now();
    if(d<=0)return;

    document.getElementById("countdown").innerText=
    `${Math.floor(d/86400000)}d ${Math.floor((d%86400000)/3600000)}h ${Math.floor((d%3600000)/60000)}m ${Math.floor((d%60000)/1000)}s`;
  },1000);
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* CURSOR */
document.addEventListener("mousemove",(e)=>{
  const c=document.getElementById("cursor");
  c.style.left=e.clientX+"px";
  c.style.top=e.clientY+"px";
});

/* 🌌 STARS ONLY */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

let w,h,stars=[];

function resize(){
  w=canvas.width=window.innerWidth;
  h=canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

for(let i=0;i<120;i++){
  stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5,s:Math.random()*0.4+0.1});
}

function draw(){
  ctx.clearRect(0,0,w,h);
  for(let s of stars){
    ctx.fillStyle="white";
    ctx.globalAlpha=0.8;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();

    s.y+=s.s;
    if(s.y>h){ s.y=0; s.x=Math.random()*w; }
  }
  requestAnimationFrame(draw);
}
draw();

</script>

</body>
</html>
