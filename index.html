<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="icon" type="image/png"
href="https://upload.wikimedia.org/wikipedia/commons/4/4a/Star_icon_stylized.png">

<title>Starlight Management</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Fredoka One', cursive;
  cursor: none;
  overflow-x: hidden;
}

/* 🌌 BACKGROUND CANVAS */
#stars, #shootingStars {
  position: fixed;
  inset: 0;
  z-index: -2;
}

/* 🌙 BACKGROUND */
body.dark {
  background: radial-gradient(circle at top, #0b0f1a, #05070d);
  color: white;
}

body.light {
  background: radial-gradient(circle at top, #f4f6ff, #e9ecff);
  color: #111;
}

/* 🧊 GLASS */
.card, .loginBox, #settings {
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  border-radius: 18px;
}

body.dark .card,
body.dark .loginBox,
body.dark #settings {
  background: rgba(21, 28, 47, 0.55);
}

body.light .card,
body.light .loginBox,
body.light #settings {
  background: rgba(255,255,255,0.6);
}

/* LAYOUT */
.container { padding: 30px; padding-bottom: 100px; }

.grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}

.split {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 15px;
}

.card { padding: 15px; }

/* QUICK LINKS */
.quickLinks a {
  display: block;
  font-size: 12px;
  padding: 6px 8px;
  margin-top: 6px;
  border-radius: 8px;
  text-decoration: none;
  background: rgba(76,110,255,0.15);
  color: inherit;
}

.quickLinks a:hover {
  background: rgba(76,110,255,0.3);
}

/* CALENDAR */
.calendarDay {
  padding: 8px;
  margin-top: 6px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  font-size: 13px;
}

/* CURSOR */
.cursor {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid white;
  position: fixed;
  pointer-events: none;
  transform: translate(-50%,-50%);
  z-index: 9999;
}
body.light .cursor { border-color:#111; }

/* VERSION */
.version {
  position: fixed;
  bottom: 0;
  width: 100%;
  font-size: 12px;
  padding: 8px;
  display: flex;
  justify-content: space-between;
  backdrop-filter: blur(10px);
}

/* NOTIF */
#notif {
  position: fixed;
  bottom: 60px;
  right: 20px;
  padding: 12px;
  border-radius: 10px;
  display: none;
  backdrop-filter: blur(12px);
  background: rgba(20,20,30,0.7);
}
</style>
</head>

<body class="dark">

<!-- 🌌 BACKGROUND -->
<canvas id="stars"></canvas>
<canvas id="shootingStars"></canvas>

<div class="cursor" id="cursor"></div>

<!-- LOGIN -->
<div id="login" style="height:100vh;display:flex;justify-content:center;align-items:center;">
  <div class="loginBox" style="padding:30px;text-align:center;">
    <h2>Starlight Login</h2>
    <input id="user" placeholder="Username"><br>
    <input id="pass" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <p id="error" style="color:red;"></p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div class="container">

<h1>📊 Starlight Dashboard</h1>

<button onclick="toggleTheme()">Light / Dark</button>

<!-- SPLIT -->
<div class="split">

<!-- COUNTDOWN -->
<div class="card">
<h2>⏳ Countdown</h2>
<input id="dateInput" type="datetime-local">
<button onclick="startCountdown()">Start</button>
<h3 id="countdown">No timer</h3>
</div>

<!-- QUICK LINKS -->
<div class="card quickLinks">
<h3>🔗 Quick Links</h3>
<a href="https://portal.inaburra.school/auth/portal" target="_blank">School Portal</a>
<a href="https://spotify.com" target="_blank">Spotify</a>
<a href="https://mail.google.com" target="_blank">Mail</a>
</div>

</div>

<!-- CALENDAR -->
<div class="card">
<h2>📅 Calendar</h2>

<div class="calendarDay">Monday — Sport Uniform</div>
<div class="calendarDay">Tuesday — Sport Uniform</div>
<div class="calendarDay">Wednesday — Assembly</div>
<div class="calendarDay">Friday 12th June — Twilight</div>

</div>

<!-- GRID -->
<div class="grid">

<div class="card">
<h2>🕒 Time</h2>
<h3 id="time"></h3>
</div>

<div class="card">
<h2>📡 System</h2>
<p>Server: Stable</p>
<p>Security: Active</p>
</div>

</div>

</div>
</div>

<!-- VERSION -->
<div class="version">
<div>Starlight System</div>
<div id="ver"></div>
</div>

<script>

/* USERS */
const users = {
  stempchase:"Hmaw4357",
  vowlesjade:"hunger-game",
  wrightbec:"swim-time"
};

/* LOGIN */
function login(){
  const u=document.getElementById("user").value.trim();
  const p=document.getElementById("pass").value.trim();

  if(users[u] && users[u]===p){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
  } else {
    document.getElementById("error").innerText="Invalid login";
  }
}

/* CLOCK */
setInterval(()=>{
  document.getElementById("time").innerText=new Date().toLocaleTimeString();
},1000);

/* COUNTDOWN */
function startCountdown(){
  const t=new Date(document.getElementById("dateInput").value).getTime();

  setInterval(()=>{
    const d=t-Date.now();
    if(d<=0)return;

    document.getElementById("countdown").innerText=
    `${Math.floor(d/86400000)}d ${Math.floor((d%86400000)/3600000)}h ${Math.floor((d%3600000)/60000)}m ${Math.floor((d%60000)/1000)}s`;
  },1000);
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* CURSOR */
document.addEventListener("mousemove",(e)=>{
  const c=document.getElementById("cursor");
  c.style.left=e.clientX+"px";
  c.style.top=e.clientY+"px";
});

/* 🌌 STAR FIELD */
const starsCanvas=document.getElementById("stars");
const sctx=starsCanvas.getContext("2d");
let w,h,stars=[];

function resize(){
  w=starsCanvas.width=window.innerWidth;
  h=starsCanvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

for(let i=0;i<120;i++){
  stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5,s:Math.random()*0.4+0.1});
}

function drawStars(){
  sctx.clearRect(0,0,w,h);
  for(let s of stars){
    sctx.beginPath();
    sctx.fillStyle="white";
    sctx.globalAlpha=0.8;
    sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    sctx.fill();

    s.y+=s.s;
    if(s.y>h){ s.y=0; s.x=Math.random()*w; }
  }
  requestAnimationFrame(drawStars);
}
drawStars();

/* 🌠 SHOOTING STARS */
const shotCanvas=document.getElementById("shootingStars");
const shctx=shotCanvas.getContext("2d");

let sw,sh,shots=[];

function resize2(){
  sw=shotCanvas.width=window.innerWidth;
  sh=shotCanvas.height=window.innerHeight;
}
resize2();
window.addEventListener("resize",resize2);

function spawnShot(){
  shots.push({
    x:Math.random()*sw,
    y:Math.random()*sh/2,
    len:Math.random()*80+80,
    speed:Math.random()*8+6,
    life:0
  });
}

setInterval(spawnShot,2500);

function drawShots(){
  shctx.clearRect(0,0,sw,sh);

  for(let i=shots.length-1;i>=0;i--){
    let s=shots[i];
    shctx.strokeStyle="white";
    shctx.globalAlpha=1;
    shctx.beginPath();
    shctx.moveTo(s.x,s.y);
    shctx.lineTo(s.x-s.len,s.y+s.len/2);
    shctx.stroke();

    s.x+=s.speed;
    s.y+=s.speed;

    if(s.x>sw||s.y>sh)shots.splice(i,1);
  }

  requestAnimationFrame(drawShots);
}
drawShots();

</script>

</body>
</html>
